title: Konstantinos Giannakopoulos
# Home page browser-tab title is "title | tagline"; description is the search-result / link-preview text
tagline: Retrieval, entity resolution and applied AI for global trade
description: Senior Data Scientist at Lloyd's List Intelligence building retrieval, entity resolution and applied AI systems for global trade and commodities.
url: https://kgiannako.github.io
baseurl: ""
lang: en-GB
timezone: Europe/London

author:
  name: Konstantinos Giannakopoulos
  role: Senior Data Scientist
  employer: Lloyd's List Intelligence
  location: London, UK
  email: kostas.chl.97@gmail.com
  github: kgiannako
  linkedin: konstantinos-giannakopoulos-352a30176

# Used by jekyll-seo-tag for structured data
social:
  name: Konstantinos Giannakopoulos
  links:
    - https://github.com/kgiannako
    - https://www.linkedin.com/in/konstantinos-giannakopoulos-352a30176/

nav:
  - title: Projects
    url: /projects/
  - title: Writing
    url: /writing/
  - title: CV
    url: /cv/

# Order of sections on /projects/ (matches each project's `group:`)
project_groups:
  - "AI, NLP & graphs"
  - "Quantitative finance"
  - "Research"

collections:
  projects:
    output: true
    permalink: /projects/:name/

permalink: /writing/:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: article, section: Writing, section_url: /writing/ }
  - scope: { path: "", type: projects }
    values: { layout: article, section: Projects, section_url: /projects/ }
  - scope: { path: "" }
    values: { layout: page }

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# All of these are supported by the standard GitHub Pages build
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
